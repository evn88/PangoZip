# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
    - name: Check Swift formatting
      run: swift format lint --strict --recursive Sources FinderExtension Tests Tools Package.swift
    - name: Check shell scripts
      run: for script in scripts/*.sh scripts/lib/*.sh; do bash -n "$script"; done
    - name: Test signing and notarization scripts without credentials
      run: python3 scripts/tests/test_release_scripts.py
    - name: Build signed application bundle
      run: scripts/build-app.sh
    - name: Verify application signature
      run: codesign --verify --deep --strict build/PangoZip.app
    - name: Build and verify DMG
      run: scripts/package-dmg.sh --skip-build
